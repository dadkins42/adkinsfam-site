<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Post - Adkins Family</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Adkins <span>Family</span></h1>
    <p class="tagline">Photos &bull; Music &bull; Adventures</p>
  </header>

  <nav class="site-nav">
    <a href="../../index.html">Home</a>
    <a href="../../blogs.html" class="active">Blogs</a>
  </nav>

  <main class="main-content">
    <a id="back-link" href="" class="back-link">&larr; Back to blog</a>

    <article>
      <div class="post-header">
        <h1 id="post-title"></h1>
        <div class="post-meta">
          <span id="post-date"></span>
          <span id="post-location"></span>
        </div>
      </div>

      <div class="post-content" id="post-content">
        <!-- Post content loaded by JS -->
      </div>
    </article>
  </main>

  <footer class="site-footer">
    &copy; 2026 Adkins Family
  </footer>

  <script src="../../js/site.js"></script>
  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const blogSlug = pathParts[pathParts.length - 2] || pathParts[pathParts.length - 1];
    loadPost(blogSlug);
  </script>
</body>
</html>
