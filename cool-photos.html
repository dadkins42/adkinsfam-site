<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Photos - Adkins Family</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Adkins <span>Family</span></h1>
    <p class="tagline">Photos &bull; Music &bull; Adventures</p>
  </header>

  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="blogs.html">Blogs</a>
    <a href="cool-photos.html" class="active">Cool Photos</a>
  </nav>

  <main class="main-content">
    <div class="page-header">
      <h1>Some Cool Photos</h1>
      <p>Old photos, old music, good times.</p>
    </div>

    <div class="photo-mosaic">
      <div class="mosaic-item mosaic-feature">
        <img src="images/kalapoola-kids.jpg" alt="The Kalapoola Kids" class="lightbox-img" onclick="openLightbox(this.src)">
        <span class="photo-caption">The Kalapoola Kids</span>
      </div>
      <div class="mosaic-item">
        <img src="images/kids-1936.jpg" alt="Adkins kids with instruments, 1936" class="lightbox-img" onclick="openLightbox(this.src)">
        <span class="photo-caption">Mar 1936</span>
      </div>
      <div class="mosaic-item">
        <img src="images/dale-guitar.jpg" alt="Dale playing guitar" class="lightbox-img" onclick="openLightbox(this.src)">
      </div>
      <div class="mosaic-item mosaic-tall">
        <img src="images/audrey-willis-1940.jpg" alt="Audrey and Willis, July 4th 1940" class="lightbox-img" onclick="openLightbox(this.src)">
        <span class="photo-caption">Audrey &amp; Willis &bull; 1940</span>
      </div>
      <div class="mosaic-item mosaic-tall">
        <img src="images/snow-guitars.jpg" alt="Willis, Dale and Vernie in the snow with guitars" class="lightbox-img" onclick="openLightbox(this.src)">
        <span class="photo-caption">Willis, Dale &amp; Vernie</span>
      </div>
      <div class="mosaic-item mosaic-wide">
        <img src="images/bikes-1937.jpg" alt="Willis, Dale, Vonnie, Bobby on bikes, 1937" class="lightbox-img" onclick="openLightbox(this.src)">
        <span class="photo-caption">Willis, Dale, Vonnie &amp; Bobby &bull; 1937</span>
      </div>
      <div class="mosaic-item">
        <img src="images/porch-1942.jpg" alt="Porch jam session, 1942" class="lightbox-img" onclick="openLightbox(this.src)">
        <span class="photo-caption">Summer 1942 &bull; Lebanon</span>
      </div>
      <div class="mosaic-item">
        <img src="images/cowgirls.jpg" alt="Cowgirls with guitars" class="lightbox-img" onclick="openLightbox(this.src)">
      </div>
      <div class="mosaic-item mosaic-wide">
        <img src="images/rv-jam.jpg" alt="Jam session by the RV" class="lightbox-img" onclick="openLightbox(this.src)">
      </div>
      <div class="mosaic-item mosaic-wide">
        <img src="images/family-guitars-lineup.jpg" alt="Family lined up with guitars" class="lightbox-img" onclick="openLightbox(this.src)">
        <span class="photo-caption">Guitar Lineup</span>
      </div>
      <div class="mosaic-item">
        <img src="images/album-vol1.jpg" alt="Adkins Family Vol 1" class="lightbox-img" onclick="openLightbox(this.src)">
      </div>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 Adkins Family
  </footer>

  <script src="js/site.js"></script>
</body>
</html>
