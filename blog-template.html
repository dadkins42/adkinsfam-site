<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Blog - Adkins Family</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Adkins <span>Family</span></h1>
    <p class="tagline">Photos &bull; Music &bull; Adventures</p>
  </header>

  <nav class="site-nav">
    <a href="../index.html">Home</a>
    <a href="../blogs.html" class="active">Blogs</a>
  </nav>

  <main class="main-content">
    <a href="../blogs.html" class="back-link">&larr; All Blogs</a>

    <div class="page-header">
      <h1 id="blog-title"></h1>
      <p id="blog-description"></p>
    </div>

    <div class="post-list" id="post-list">
      <!-- Posts loaded by JS -->
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 Adkins Family
  </footer>

  <script src="../js/site.js"></script>
  <script>
    const blogSlug = window.location.pathname.split('/').filter(Boolean).pop().replace('.html', '');
    loadBlogPosts(blogSlug, 'post-list', 'blog-title', 'blog-description', 'page-title');
  </script>
</body>
</html>
