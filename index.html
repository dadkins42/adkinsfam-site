<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adkins Family</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <h1>Adkins <span>Family</span></h1>
    <p class="tagline">Photos &bull; Music &bull; Adventures</p>
  </header>

  <nav class="site-nav">
    <a href="index.html" class="active">Home</a>
    <a href="blogs.html">Blogs</a>
    <a href="cool-photos.html">Cool Photos</a>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <img src="images/hero-family.jpg" alt="The Adkins family" class="hero-img">
    <div class="hero-overlay">
      <h2>All Things Adkins</h2>
    </div>
  </section>

  <main class="main-content">

    <!-- Intro Section -->
    <section class="home-intro">
      <p class="intro-text">
        This site is all things Adkins. Trip blogs, old photos, new photos, old music, new music &mdash;
        generations of family, stories, and songs.
      </p>
    </section>

    <!-- Family Photo Grid -->
    <section class="home-section">
      <div class="photo-grid">
        <div class="grid-item">
          <img src="images/band-portrait.jpg" alt="Band portrait" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/wintergrass.jpg" alt="Wintergrass performance" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/mandolin-bass.jpg" alt="Mandolin and bass on stage" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/kalapoola-kids.jpg" alt="The Kalapoola Kids" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/recording-session.jpg" alt="Recording session" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/family-dinner.jpg" alt="Family dinner" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/rv-crew.jpg" alt="The crew by the RV" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/coffee-girls.jpg" alt="Coffee date" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/christmas-kids.jpg" alt="Christmas breakfast" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/birthday-cake.jpg" alt="Birthday celebration" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/new-baby.jpg" alt="New baby" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
        <div class="grid-item">
          <img src="images/porch-1942.jpg" alt="Porch jam session, 1942" class="lightbox-img" onclick="openLightbox(this.src)">
        </div>
      </div>
    </section>

    <!-- Recent Posts -->
    <section class="home-section">
      <h2 class="section-heading"><span class="heading-accent">Latest Posts</span></h2>
      <div id="recent-posts" class="post-list"></div>
    </section>

  </main>

  <footer class="site-footer">
    &copy; 2026 Adkins Family
  </footer>

  <script src="js/site.js"></script>
  <script>
    // Load recent posts on homepage
    (async function() {
      try {
        const resp = await fetch('blogs/manifest.json?' + Date.now());
        const data = await resp.json();
        const container = document.getElementById('recent-posts');
        let allPosts = [];

        for (const blog of data.blogs) {
          try {
            const postsResp = await fetch('blogs/' + blog.slug + '/posts.json?' + Date.now());
            const posts = await postsResp.json();
            posts.forEach(p => {
              p._blogSlug = blog.slug;
              p._blogTitle = blog.title;
              p._blogEmoji = blog.emoji;
            });
            allPosts = allPosts.concat(posts);
          } catch(e) {}
        }

        allPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
        const recent = allPosts.slice(0, 5);

        if (recent.length === 0) {
          container.innerHTML = '<p style="color: var(--text-secondary);">No posts yet. Check back soon!</p>';
          return;
        }

        recent.forEach(post => {
          const card = document.createElement('div');
          card.className = 'post-card';

          let imgHtml = '';
          if (post.images && post.images.length > 0) {
            imgHtml = '<img src="blogs/' + post._blogSlug + '/' + post.images[0] + '" alt="" class="post-image">';
          }

          card.innerHTML = imgHtml +
            '<div class="post-body">' +
              '<div class="post-meta">' +
                '<span class="blog-badge">' + (post._blogEmoji || '') + ' ' + post._blogTitle + '</span> &bull; ' +
                formatDate(post.date) +
                (post.location ? ' &bull; <span class="location">' + post.location + '</span>' : '') +
              '</div>' +
              '<h2><a href="blogs/' + post._blogSlug + '/' + post.slug + '.html">' + post.title + '</a></h2>' +
              (post.excerpt ? '<p class="post-excerpt">' + post.excerpt + '</p>' : '') +
            '</div>';
          container.appendChild(card);
        });
      } catch(e) {
        console.log('Could not load recent posts:', e);
      }
    })();
  </script>
</body>
</html>
